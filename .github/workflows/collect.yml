name: Haberleri topla ve GitHub Pages yayinla
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test*.py'
      - name: Collect official headlines
        run: python tools/pipeline.py collect
      - name: Persist collected snapshot
        run: |
          git config user.name "deneyim-gundem-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Update official headline snapshot" && git push)
      - name: Prepare public files
        run: |
          mkdir -p dist
          cp index.html app.js styles.css sw.js manifest.webmanifest icon.svg news.json dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify-live:
    if: github.event_name != 'schedule'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Test live site at phone and desktop sizes
        env:
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python tools/verify_browser.py "$LIVE_URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-browser-verification
          path: verification/
